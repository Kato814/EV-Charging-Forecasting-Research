name: library-check

on:
  pull_request:
    paths:
      - 'code/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'MANIFEST.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: library-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,gate1]
      - run: python scripts/validate_library.py
      - run: python scripts/check_compute_environment.py
      - run: python -m pytest code/tests
      - run: python -m compileall -q code/src scripts
      - run: python -m ruff check code/src scripts code/tests
