[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-charging-forecasting-research"
version = "0.5.0"
description = "Research library and reproducible codebase for EV charging forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]
gate1 = [
  "scipy==1.17.1",
  "scikit-learn==1.9.0",
  "joblib==1.6.0",
  "pyarrow==25.0.1",
  "threadpoolctl==3.6.0",
]

[tool.setuptools]
package-dir = {"" = "code/src"}

[tool.setuptools.packages.find]
where = ["code/src"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"code/src/evcf/forecasting/acn_jpl_development_experts.py" = ["RUF100"]
