dataset_id: D0001
api_base_url: https://ev.caltech.edu/api/v1/
token_environment_variable: ACN_API_TOKEN

# Pilot acquisition policy. Set an explicit, timezone-aware window before running.
pilot:
  site: caltech
  start: null
  end: null
  metadata_max_sessions: 500
  timeseries_max_sessions: 50
  output_directory: data/raw/acn/gate0

rolling_task:
  issue_frequency_minutes: 15
  horizons_minutes: [15, 30, 60, 120, 240]
  end_time_semantics: exclusive

safety:
  raw_data_in_git: false
  overwrite_by_default: false
  timeseries_opt_in: true
  preserve_raw_timestamp_strings: true

# Frozen protocol for PR #12. This authorizes only the 100-session preflight;
# a full-month /ts acquisition remains out of scope.
jpl_2019_05_preflight:
  timezone: America/Los_Angeles
  analysis_start: "2019-05-01T00:00:00-07:00"
  analysis_end_exclusive: "2019-06-01T00:00:00-07:00"
  random_seed: 201905
  sample_size: 100
  invalid_charging_current_rate_limit: 0.10
  invalid_pilot_signal_rate_limit: 0.10
  unmatched_metadata_rate_limit: 0.01
  full_month_timeseries_authorized: false
