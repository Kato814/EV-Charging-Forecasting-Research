name: library-check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: library-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python scripts/validate_library.py
      - run: python scripts/check_compute_environment.py
      - run: python -m pytest code/tests
      - run: python -m compileall -q code/src scripts
      - run: >-
          python -m ruff check
          code/src/evcf/data/acn_api.py
          code/src/evcf/data/acn_audit.py
          code/src/evcf/data/acn_coverage.py
          code/src/evcf/data/acn_jpl_full_month_qa.py
          code/src/evcf/data/acn_jpl_full_month_ts.py
          code/src/evcf/data/acn_jpl_gate0.py
          code/src/evcf/data/acn_jpl_metadata_qa.py
          code/src/evcf/data/acn_jpl_official_reference.py
          code/src/evcf/data/acn_jpl_ts_preflight.py
          scripts/acn_gate0.py
          scripts/acn_jpl_2019_05.py
          scripts/acn_jpl_full_month_ts.py
          scripts/acn_monthly_coverage.py
          scripts/check_compute_environment.py
          code/tests/test_acn_gate0.py
          code/tests/test_acn_coverage.py
          code/tests/test_acn_jpl_gate0.py
          code/tests/test_acn_jpl_full_month_cli.py
          code/tests/test_acn_jpl_full_month_qa.py
          code/tests/test_acn_jpl_full_month_ts.py
          code/tests/test_acn_jpl_metadata_qa.py
          code/tests/test_acn_jpl_official_reference.py
          code/tests/test_acn_jpl_ts_preflight.py
          code/tests/test_compute_environment.py
